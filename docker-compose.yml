services:
  macro-flow-dashboard:
    build: .
    container_name: macro-flow-dashboard
    ports:
      - "8503:8503"
    restart: unless-stopped
    dns_opt:
      - no-aaaa
    env_file:
      - .env
    environment:
      - MACRO_DATA_DIR=/app/data
      - KIS_TOKEN_FILE=/shared/kis_token.json
    volumes:
      - ./data:/app/data
      - /home/yulimseo/stock_dashboard/data/kis_token.json:/shared/kis_token.json:ro
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8503", "--server.baseUrlPath=macro"]

  caddy:
    image: caddy:2-alpine
    container_name: macro-flow-caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "0.0.0.0:8087:8087"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./home:/srv-home:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - macro-flow-dashboard

volumes:
  caddy_data:
  caddy_config:
