services:
  macro-flow-dashboard:
    build: .
    container_name: macro-flow-dashboard
    # 앱은 LAN 8503, Caddy가 8087. 8501(hynix) 8502(fermi)와 겹치지 않게 한다.
    ports:
      - "8503:8503"
    restart: unless-stopped
    dns_opt:
      - no-aaaa
    env_file:
      - .env
    environment:
      - MACRO_DATA_DIR=/app/data
      # stock_dashboard와 같은 KIS 앱키 — 토큰 캐시를 읽기전용으로 공유(재발급 알림톡 방지).
      - KIS_TOKEN_FILE=/shared/kis_token.json
    volumes:
      - ./data:/app/data
      - /home/yulimseo/stock_dashboard/data/kis_token.json:/shared/kis_token.json:ro

  caddy:
    image: caddy:2-alpine
    container_name: macro-flow-caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "0.0.0.0:8087:8087"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - macro-flow-dashboard

volumes:
  caddy_data:
  caddy_config:
